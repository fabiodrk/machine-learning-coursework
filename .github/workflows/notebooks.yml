name: Execute study notebooks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_notebooks.py
      - name: Execute housing workflow (downloads public dataset)
        run: python scripts/check_notebooks.py --include-downloads --notebook 02

